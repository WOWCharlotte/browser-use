<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-base:      #F7F8FA;
  --bg-surface:   #FFFFFF;
  --bg-sidebar:   #F3F4F6;
  --fg-primary:   #18181B;
  --fg-secondary: #45515E;
  --fg-muted:     #9CA3AF;
  --fg-placeholder: #9B9B9B;
  --accent:       #3B82F6;
  --accent-light: #EFF6FF;
  --accent-hover: #2563EB;
  --border:       #E5E7EB;
  --border-light: #F2F3F5;
  --shadow-sm:    0 1px 3px rgba(0,0,0,0.06);
  --shadow-md:    0 4px 12px rgba(0,0,0,0.08);
  --radius-sm:    6px;
  --radius-md:    10px;
  --radius-lg:    16px;
  --radius-pill:  9999px;
  --font-ui:      'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-display: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono:    'Roboto Mono', 'Cascadia Code', 'Fira Code', ui-monospace, monospace;
  --sidebar-w:    240px;
  --sidebar-collapsed-w: 56px;
  --middle-w:     440px;
  --transition:   0.22s cubic-bezier(0.4,0,0.2,1);
}

html, body {
  height: 100%;
  font-family: var(--font-ui);
  background: var(--bg-base);
  color: var(--fg-primary);
  font-size: 14px;
  line-height: 1.5;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) var(--middle-w) 1fr;
  height: 100vh;
  transition: grid-template-columns var(--transition);
}

.app.sidebar-collapsed {
  grid-template-columns: var(--sidebar-collapsed-w) var(--middle-w) 1fr;
}

/* ─── LEFT SIDEBAR ───────────────────────────── */
.sidebar {
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

.sidebar-header {
  padding: 14px 12px 10px;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 56px;
  border-bottom: 1px solid var(--border-light);
}

.logo-mark {
  width: 28px;
  height: 28px;
  flex-shrink: 0;
  background: var(--accent);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.logo-mark svg { width: 16px; height: 16px; }

.logo-text {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 600;
  color: var(--fg-primary);
  letter-spacing: -0.3px;
  white-space: nowrap;
  overflow: hidden;
  opacity: 1;
  transition: opacity var(--transition), width var(--transition);
}
.sidebar-collapsed .logo-text { opacity: 0; width: 0; }

.new-chat-btn {
  margin: 10px 12px 6px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
  cursor: pointer;
  font-family: var(--font-ui);
  font-size: 13px;
  font-weight: 500;
  color: var(--fg-secondary);
  white-space: nowrap;
  overflow: hidden;
  transition: background var(--transition), border-color var(--transition), box-shadow var(--transition);
  box-shadow: var(--shadow-sm);
}

.new-chat-btn:hover {
  background: var(--bg-surface);
  border-color: var(--accent);
  color: var(--accent);
  box-shadow: var(--shadow-md);
}

.new-chat-btn svg { flex-shrink: 0; }

.btn-text {
  opacity: 1;
  transition: opacity var(--transition);
}
.sidebar-collapsed .btn-text { opacity: 0; width: 0; overflow: hidden; }

.history-nav {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0 8px;
  scrollbar-width: thin;
  scrollbar-color: transparent transparent;
}
.history-nav:hover { scrollbar-color: var(--border) transparent; }

.history-section { margin-bottom: 4px; }

.history-label {
  padding: 6px 16px 4px;
  font-size: 11px;
  font-weight: 600;
  color: var(--fg-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  white-space: nowrap;
  overflow: hidden;
  opacity: 1;
  transition: opacity var(--transition);
}
.sidebar-collapsed .history-label { opacity: 0; }

.history-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 8px 7px 12px;
  cursor: pointer;
  border-radius: var(--radius-sm);
  margin: 0 4px;
  transition: background var(--transition);
  position: relative;
  min-width: 0;
}

.history-item:hover { background: rgba(0,0,0,0.04); }
.history-item.active { background: var(--accent-light); }

.history-item-icon { flex-shrink: 0; color: var(--fg-muted); }
.history-item.active .history-item-icon { color: var(--accent); }

.history-item-title {
  font-size: 13px;
  color: var(--fg-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  min-width: 0;
  opacity: 1;
  transition: opacity var(--transition);
}
.history-item.active .history-item-title { color: var(--accent); font-weight: 500; }
.sidebar-collapsed .history-item-title { opacity: 0; width: 0; }

/* Inline edit */
.history-item-title-input {
  font-family: var(--font-ui);
  font-size: 13px;
  font-weight: 500;
  color: var(--fg-primary);
  background: var(--bg-surface);
  border: 1px solid var(--accent);
  border-radius: 4px;
  padding: 2px 6px;
  outline: none;
  flex: 1;
  min-width: 0;
  width: 100%;
  box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
}

/* Item actions (visible on hover) */
.history-item-actions {
  display: flex;
  gap: 2px;
  flex-shrink: 0;
  opacity: 0;
  transition: opacity var(--transition);
}

.history-item:hover .history-item-actions { opacity: 1; }

.history-action-btn {
  width: 22px;
  height: 22px;
  border: none;
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--fg-muted);
  border-radius: 4px;
  transition: background var(--transition), color var(--transition);
  padding: 0;
}
.history-action-btn:hover { background: rgba(0,0,0,0.08); color: var(--fg-secondary); }
.history-action-btn.delete:hover { background: #FEE2E2; color: #DC2626; }

.sidebar-footer {
  padding: 10px 8px;
  border-top: 1px solid var(--border-light);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.sidebar-footer-left {
  display: flex;
  align-items: center;
  gap: 2px;
  overflow: hidden;
  flex: 1;
}

.icon-btn {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--fg-muted);
  transition: background var(--transition), color var(--transition);
  flex-shrink: 0;
}
.icon-btn:hover { background: rgba(0,0,0,0.06); color: var(--fg-secondary); }
.icon-btn.active { color: var(--accent); }

/* ─── MIDDLE CHAT ────────────────────────────── */
.middle {
  background: var(--bg-surface);
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  overflow: hidden;
}

.chat-header {
  padding: 12px 20px;
  border-bottom: 1px solid var(--border-light);
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 60px;
}

.agent-avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 600;
  color: white;
}

.agent-info { flex: 1; min-width: 0; }

.agent-name {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 600;
  color: var(--fg-primary);
  letter-spacing: -0.2px;
}

.agent-status {
  font-size: 12px;
  color: var(--fg-muted);
  display: flex;
  align-items: center;
  gap: 5px;
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #22C55E;
  display: inline-block;
}

.header-actions { display: flex; gap: 4px; }

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.messages:hover { scrollbar-color: var(--fg-muted) transparent; }

.msg {
  display: flex;
  gap: 10px;
  max-width: 90%;
  animation: msgIn 0.3s cubic-bezier(0.16,1,0.3,1);
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.msg.user { align-self: flex-end; flex-direction: row-reverse; }

.msg-avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
  align-self: flex-start;
}

.msg.user .msg-avatar { background: linear-gradient(135deg, #3B82F6, #1D4ED8); color: white; }
.msg.ai  .msg-avatar { background: linear-gradient(135deg, #667EEA, #764BA2); color: white; }

.msg.user .msg-avatar svg,
.msg.ai  .msg-avatar svg { width: 14px; height: 14px; }

.msg-content {
  background: var(--bg-sidebar);
  border-radius: var(--radius-md);
  border: 1px solid var(--border-light);
  padding: 10px 14px;
  font-size: 14px;
  line-height: 1.6;
  color: var(--fg-primary);
  position: relative;
}

.msg.user .msg-content {
  background: var(--accent-light);
  border-color: rgba(59,130,246,0.15);
  border-radius: var(--radius-md) var(--radius-md) 4px var(--radius-md);
}

.msg.ai .msg-content {
  border-radius: var(--radius-md) var(--radius-md) var(--radius-md) 4px;
}

.msg-content p { margin-bottom: 8px; }
.msg-content p:last-child { margin-bottom: 0; }

.msg-content code {
  font-family: var(--font-mono);
  font-size: 12.5px;
  background: rgba(0,0,0,0.06);
  padding: 1px 5px;
  border-radius: 4px;
}

.msg-content pre {
  background: #1E1E2E;
  color: #CDD6F4;
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  overflow-x: auto;
  margin: 8px 0;
  font-family: var(--font-mono);
  font-size: 12.5px;
  line-height: 1.5;
}

.msg-content pre code { background: none; padding: 0; color: inherit; }

.msg-content ul, .msg-content ol { padding-left: 18px; margin: 6px 0; }
.msg-content li { margin-bottom: 3px; }
.msg-content strong { font-weight: 600; }
.msg-content em { font-style: italic; }

/* Message attachments */
.msg-attachments {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}

.msg-attachment {
  max-width: 200px;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid var(--border-light);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  background: rgba(0,0,0,0.03);
  font-size: 12px;
  color: var(--fg-secondary);
}

.msg-attachment img {
  width: 36px;
  height: 36px;
  border-radius: 4px;
  object-fit: cover;
  flex-shrink: 0;
}

.msg-attachment-icon {
  width: 36px;
  height: 36px;
  border-radius: 4px;
  background: var(--accent-light);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: var(--accent);
}

.msg-attachment-name {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  font-size: 11px;
  max-width: 130px;
}

.msg-attachment-ext {
  font-size: 10px;
  font-weight: 600;
  color: var(--fg-muted);
  text-transform: uppercase;
}

/* Typing indicator */
.typing-indicator {
  display: flex;
  gap: 4px;
  padding: 4px 0;
  align-items: center;
}

.typing-indicator span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--fg-muted);
  animation: bounce 1.2s infinite;
}

.typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.3s; }

@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-4px); opacity: 1; }
}

/* Input area */
.input-area {
  padding: 12px 16px 16px;
  border-top: 1px solid var(--border-light);
}

.input-wrapper {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 8px 8px 8px 14px;
  transition: border-color var(--transition), box-shadow var(--transition);
}

.input-wrapper:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
}

.input-wrapper textarea {
  flex: 1;
  border: none;
  outline: none;
  resize: none;
  font-family: var(--font-ui);
  font-size: 14px;
  color: var(--fg-primary);
  background: transparent;
  line-height: 1.5;
  max-height: 120px;
  overflow-y: auto;
  scrollbar-width: thin;
}

.input-wrapper textarea::placeholder { color: var(--fg-placeholder); }

.attach-btn {
  width: 34px;
  height: 34px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--fg-muted);
  flex-shrink: 0;
  transition: background var(--transition), color var(--transition);
}
.attach-btn:hover { background: rgba(0,0,0,0.06); color: var(--fg-secondary); }
.attach-btn:active { transform: scale(0.95); }

.send-btn {
  width: 34px;
  height: 34px;
  border-radius: var(--radius-sm);
  border: none;
  background: var(--accent);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  flex-shrink: 0;
  transition: background var(--transition), transform 0.1s;
}

.send-btn:hover { background: var(--accent-hover); }
.send-btn:active { transform: scale(0.95); }
.send-btn:disabled { background: var(--border); cursor: not-allowed; }

/* Attachment preview strip */
.attach-preview-strip {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  padding: 6px 14px 0;
}

.attach-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px 4px 6px;
  background: var(--bg-sidebar);
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
  font-size: 12px;
  color: var(--fg-secondary);
  max-width: 160px;
  animation: chipIn 0.2s ease;
}

@keyframes chipIn {
  from { opacity: 0; transform: scale(0.85); }
  to   { opacity: 1; transform: scale(1); }
}

.attach-chip-img {
  width: 24px;
  height: 24px;
  border-radius: 4px;
  object-fit: cover;
  flex-shrink: 0;
}

.attach-chip-icon {
  width: 24px;
  height: 24px;
  border-radius: 4px;
  background: var(--accent-light);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: var(--accent);
}

.attach-chip-name {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}

.attach-chip-remove {
  width: 16px;
  height: 16px;
  border: none;
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--fg-muted);
  border-radius: 50%;
  flex-shrink: 0;
  padding: 0;
  transition: background var(--transition), color var(--transition);
}
.attach-chip-remove:hover { background: rgba(0,0,0,0.1); color: var(--fg-secondary); }

.input-hint {
  font-size: 11px;
  color: var(--fg-muted);
  margin-top: 6px;
  padding: 0 2px;
}

/* ─── RIGHT BROWSER ─────────────────────────── */
.browser {
  background: var(--bg-surface);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.browser-chrome {
  background: var(--bg-sidebar);
  border-bottom: 1px solid var(--border);
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 40px;
}

.traffic-lights {
  display: flex;
  gap: 5px;
  flex-shrink: 0;
}

.traffic-light {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}

.traffic-light.red    { background: #FF5F57; }
.traffic-light.yellow { background: #FFBD2E; }
.traffic-light.green  { background: #28CA41; }

.browser-nav {
  display: flex;
  gap: 2px;
  flex-shrink: 0;
}

.browser-nav button {
  width: 24px;
  height: 24px;
  border: none;
  background: transparent;
  border-radius: 4px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--fg-muted);
  transition: background var(--transition);
}
.browser-nav button:hover { background: rgba(0,0,0,0.06); }

.browser-url-bar {
  flex: 1;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
  padding: 4px 12px;
  font-size: 12px;
  color: var(--fg-muted);
  font-family: var(--font-ui);
  display: flex;
  align-items: center;
  gap: 6px;
}

.browser-url-bar svg { flex-shrink: 0; color: var(--fg-muted); }

.browser-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  background: #FAFAFA;
  position: relative;
}

.browser-empty-icon {
  width: 56px;
  height: 56px;
  border-radius: var(--radius-lg);
  background: linear-gradient(135deg, #667EEA22, #764BA222);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #667EEA;
}

.browser-empty-text {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 500;
  color: var(--fg-muted);
  text-align: center;
}

.browser-empty-sub {
  font-size: 12px;
  color: var(--fg-muted);
  opacity: 0.7;
}

.browser-dots { display: flex; gap: 6px; }
.browser-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--border); }

/* Tweaks panel */
.tweaks-panel {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  box-shadow: var(--shadow-md);
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 100;
  min-width: 200px;
}

.tweaks-title {
  font-size: 11px;
  font-weight: 600;
  color: var(--fg-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.tweak-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.tweak-label { font-size: 12px; color: var(--fg-secondary); }

.tweak-toggle { display: flex; gap: 4px; }

.tweak-toggle button {
  padding: 3px 10px;
  border: 1px solid var(--border);
  background: var(--bg-sidebar);
  border-radius: var(--radius-pill);
  font-size: 11px;
  font-family: var(--font-ui);
  cursor: pointer;
  color: var(--fg-secondary);
  transition: all var(--transition);
}

.tweak-toggle button.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

/* Scrollbar */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* Confirm Modal */
.confirm-modal {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
}

.confirm-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(2px);
}

.confirm-dialog {
  position: relative;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px 28px 20px;
  box-shadow: 0 16px 48px rgba(0,0,0,0.18);
  width: 300px;
  text-align: center;
  animation: modalIn 0.2s cubic-bezier(0.16,1,0.3,1);
}

@keyframes modalIn {
  from { opacity: 0; transform: scale(0.9); }
  to   { opacity: 1; transform: scale(1); }
}

.confirm-icon {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: #FEE2E2;
  color: #DC2626;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 14px;
}

.confirm-title {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  color: var(--fg-primary);
  margin-bottom: 8px;
}

.confirm-body {
  font-size: 13px;
  color: var(--fg-secondary);
  line-height: 1.5;
  margin-bottom: 20px;
}

.confirm-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
}

.confirm-btn {
  padding: 8px 20px;
  border-radius: var(--radius-pill);
  font-family: var(--font-ui);
  font-size: 13px;
  font-weight: 500;
  border: 1px solid var(--border);
  background: var(--bg-surface);
  color: var(--fg-secondary);
  cursor: pointer;
  transition: all var(--transition);
}

.confirm-btn.cancel:hover {
  background: var(--bg-sidebar);
  border-color: var(--fg-muted);
}

.confirm-btn.delete {
  background: #DC2626;
  border-color: #DC2626;
  color: white;
}

.confirm-btn.delete:hover {
  background: #B91C1C;
  border-color: #B91C1C;
}

.confirm-btn:active { transform: scale(0.96); }
</style>
</head>

<script>
// ─── STATE ────────────────────────────────────────────────────────────────
let currentChatId = 0;
let isCollapsed = false;
let pendingAttachments = [];

const chatTitles = {
  0: 'Brand identity refresh',
  1: 'Q3 growth analysis',
  2: 'Feature spec — notifications',
  3: 'API integration notes',
  4: 'Onboarding flow review',
  5: 'Design system audit'
};

const chatHistories = {
  0: [
    { role: 'ai', text: 'Hi there! I\'m your AI workspace assistant. I can help you with a wide range of tasks — from analyzing documents and drafting content to answering questions and exploring ideas. What would you like to work on today?' }
  ],
  1: [
    { role: 'ai', text: 'Hello! Ready to dive into the Q3 growth analysis. Let\'s start by looking at the key metrics you mentioned — user acquisition, retention, and revenue growth. What specific aspects would you like to explore first?' }
  ],
  2: [
    { role: 'ai', text: 'Great, let\'s spec out the notifications feature. I\'ll need to understand a few things: Who receives notifications (users, admins)? What channels (push, email, in-app)? And what events trigger them? Let\'s start with the user-facing notification types.' }
  ],
  3: [
    { role: 'ai', text: 'Here are the key notes from the API integration session:\n\n**Authentication**\n- OAuth 2.0 with refresh tokens\n- Token expiry: 1 hour, auto-refresh\n\n**Rate Limits**\n- 1000 req/min per API key\n- Burst: 100 req/s\n\n**Endpoints**\n- `GET /v2/users` — paginated user list\n- `POST /v2/events` — event ingestion\n\nShall I elaborate on any of these?' }
  ],
  4: [
    { role: 'ai', text: 'Reviewed the onboarding flow. Key findings:\n\n1. **Step 3 friction** — 34% drop-off at the "team invite" step. Consider making it skippable.\n2. **Empty state** — After onboarding, users land on a blank dashboard. Show sample data or a guided tour.\n3. **Progress indicator** — Only 2 steps visible; users don\'t know how much is left.\n\nWant me to draft wireframes for the improvements?' }
  ],
  5: [
    { role: 'ai', text: 'Design system audit complete. Here\'s the summary:\n\n| Component | Status | Notes |\n|---|---|---|\n| Button | ⚠️ 3 variants | Consolidate to primary/secondary/ghost |\n| Input | ✅ Consistent | No changes needed |\n| Card | ❌ 7 variants | Need to rationalize to 2 |\n| Modal | ⚠️ Overlay | Improve backdrop contrast |\n\nI\'ll prepare a detailed report with specific recommendations. Ready when you are.' }
  ]
};

// ─── HELPERS ───────────────────────────────────────────────────────────────
const SPECIAL_CHAR_REGEX = /[<>:"/\\|?*\x00-\x1f]/;

function sanitizeTitle(val) {
  return val.replace(SPECIAL_CHAR_REGEX, '').slice(0, 20);
}

function parseMarkdown(text) {
  return text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/```([\s\S]+?)```/g, '<pre><code>$1</code></pre>')
    .replace(/^\*{3}\s+(.+)$/gm, '<h3>$1</h3>')
    .replace(/^\*{2}\s+(.+)$/gm, '<h2>$1</h2>')
    .replace(/^\*\s+(.+)$/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
    .replace(/\n\n/g, '</p><p>')
    .replace(/\n/g, '<br>')
    .replace(/^([^<].*)$/gm, (m) => {
      if (m.startsWith('<p>') || m.startsWith('<h') || m.startsWith('<ul') || m.startsWith('<pre')) return m;
      return `<p>${m}</p>`;
    });
}

function scrollMessages() {
  const el = document.getElementById('messages');
  el.scrollTop = el.scrollHeight;
}

// ─── ATTACHMENT HELPERS ───────────────────────────────────────────────────
const imageExts = new Set(['jpg','jpeg','png']);

function fileExt(name) {
  return name.split('.').pop().toLowerCase();
}

function fileIconHTML() {
  return `<div class="attach-chip-icon">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
    </svg>
  </div>`;
}

function renderAttachPreview() {
  const strip = document.getElementById('attachPreviewStrip');
  strip.innerHTML = '';
  pendingAttachments.forEach((att, idx) => {
    const chip = document.createElement('div');
    chip.className = 'attach-chip';
    if (att.isImage) {
      chip.innerHTML = `
        <img class="attach-chip-img" src="${att.dataUrl}" alt="${att.file.name}">
        <span class="attach-chip-name" title="${att.file.name}">${att.file.name}</span>
        <button class="attach-chip-remove" data-idx="${idx}" title="Remove">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>`;
    } else {
      chip.innerHTML = `
        ${fileIconHTML()}
        <span class="attach-chip-name" title="${att.file.name}">${att.file.name}</span>
        <button class="attach-chip-remove" data-idx="${idx}" title="Remove">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>`;
    }
    strip.appendChild(chip);
  });

  strip.querySelectorAll('.attach-chip-remove').forEach(btn => {
    btn.addEventListener('click', () => {
      pendingAttachments.splice(parseInt(btn.dataset.idx), 1);
      renderAttachPreview();
    });
  });
}

function renderAttachmentsInMsg(attachments) {
  if (!attachments || attachments.length === 0) return '';
  let html = '<div class="msg-attachments">';
  attachments.forEach(att => {
    const ext = fileExt(att.name);
    if (att.isImage) {
      html += `<div class="msg-attachment">
        <img src="${att.dataUrl}" alt="${att.name}">
        <span class="msg-attachment-name">${att.name}</span>
      </div>`;
    } else {
      html += `<div class="msg-attachment">
        <div class="msg-attachment-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
        </div>
        <span class="msg-attachment-name">${att.name}</span>
        <span class="msg-attachment-ext">.${ext}</span>
      </div>`;
    }
  });
  html += '</div>';
  return html;
}

// ─── RENDER SIDEBAR ───────────────────────────────────────────────────────
function renderSidebar() {
  const nav = document.getElementById('historyNav');
  const sections = [
    { label: 'Today', ids: [0, 1, 2] },
    { label: 'Yesterday', ids: [3, 4] },
    { label: 'Previous 7 Days', ids: [5] }
  ];

  nav.innerHTML = '';

  sections.forEach(section => {
    const sectionDiv = document.createElement('div');
    sectionDiv.className = 'history-section';
    sectionDiv.innerHTML = `<div class="history-label btn-text">${section.label}</div>`;

    section.ids.forEach(id => {
      const title = chatTitles[id] || 'New conversation';
      const item = document.createElement('div');
      item.className = `history-item${currentChatId === id ? ' active' : ''}`;
      item.dataset.chatId = id;
      item.innerHTML = `
        <span class="history-item-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </span>
        <span class="history-item-title" data-chat-id="${id}">${title}</span>
        <div class="history-item-actions">
          <button class="history-action-btn edit" data-chat-id="${id}" title="Rename">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
          </button>
          <button class="history-action-btn delete" data-chat-id="${id}" title="Delete">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
          </button>
        </div>
      `;
      sectionDiv.appendChild(item);
    });

    nav.appendChild(sectionDiv);
  });

  // Event delegation for sidebar items
  nav.querySelectorAll('.history-item').forEach(item => {
    item.addEventListener('click', (e) => {
      // Ignore clicks on buttons
      if (e.target.closest('.history-action-btn')) return;
      switchChat(parseInt(item.dataset.chatId));
    });
  });

  nav.querySelectorAll('.history-action-btn.edit').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      startEditingTitle(parseInt(btn.dataset.chatId));
    });
  });

  nav.querySelectorAll('.history-action-btn.delete').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      confirmDeleteChat(parseInt(btn.dataset.chatId));
    });
  });
}

// ─── INLINE TITLE EDITING ──────────────────────────────────────────────────
function startEditingTitle(chatId) {
  const titleEl = document.querySelector(`.history-item-title[data-chat-id="${chatId}"]`);
  if (!titleEl) return;

  const current = chatTitles[chatId] || '';
  titleEl.style.display = 'none';

  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'history-item-title-input';
  input.value = current;
  input.maxLength = 20;
  input.dataset.chatId = chatId;

  const parent = titleEl.parentElement;

  // Insert input after icon
  titleEl.insertAdjacentElement('afterend', input);
  input.focus();
  input.select();

  function finishEdit() {
    const raw = input.value;
    const sanitized = sanitizeTitle(raw) || current;
    chatTitles[chatId] = sanitized;
    // If sanitized would be empty (all special chars), keep current
    if (!sanitized && raw) chatTitles[chatId] = current;
    renderSidebar();
    if (currentChatId === chatId) renderMessages(chatId);
  }

  input.addEventListener('blur', finishEdit);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      input.blur();
    }
    if (e.key === 'Escape') {
      input.value = current;
      input.blur();
    }
  });

  // Block non-allowed chars on input
  input.addEventListener('keypress', (e) => {
    if (SPECIAL_CHAR_REGEX.test(e.key)) e.preventDefault();
  });
}

// ─── DELETE CONFIRMATION ──────────────────────────────────────────────────
let pendingDeleteId = null;

function showConfirmModal(title) {
  const modal = document.getElementById('confirmModal');
  const body = document.getElementById('confirmBody');
  body.textContent = `确定删除会话「${title}」吗？删除后无法恢复。`;
  modal.style.display = 'flex';
  pendingDeleteId = null; // reset
}

function hideConfirmModal() {
  document.getElementById('confirmModal').style.display = 'none';
}

function confirmDeleteChat(chatId) {
  const title = chatTitles[chatId] || '此会话';
  showConfirmModal(title);
  pendingDeleteId = chatId;
}

// Wire up modal buttons
document.getElementById('confirmCancel').addEventListener('click', hideConfirmModal);
document.getElementById('confirmOk').addEventListener('click', () => {
  if (pendingDeleteId === null) return;
  const chatId = pendingDeleteId;

  // Remove from state
  delete chatTitles[chatId];
  delete chatHistories[chatId];

  // If deleting active chat, switch to first available
  if (currentChatId === chatId) {
    const remaining = Object.keys(chatTitles);
    currentChatId = remaining.length > 0 ? parseInt(remaining[0]) : null;
  }

  hideConfirmModal();
  pendingDeleteId = null;
  renderSidebar();
  if (currentChatId !== null) renderMessages(currentChatId);
});
document.querySelector('.confirm-backdrop').addEventListener('click', hideConfirmModal);

// ─── CHAT RENDERING ───────────────────────────────────────────────────────
function renderMessages(chatId) {
  const container = document.getElementById('messages');
  const history = chatHistories[chatId] || [];

  container.innerHTML = '';

  history.forEach(msg => {
    const div = document.createElement('div');
    div.className = `msg ${msg.role}`;

    const avatarSVG = msg.role === 'ai'
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a4 4 0 0 1 4 4v1a4 4 0 0 1-8 0V6a4 4 0 0 1 4-4z"/><path d="M16 14v1a4 4 0 0 1-8 0v-1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/><path d="M9 19v1a3 3 0 0 0 6 0v-1"/></svg>`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;

    const attHtml = renderAttachmentsInMsg(msg.attachments);

    div.innerHTML = `
      <div class="msg-avatar">${avatarSVG}</div>
      <div class="msg-content">${parseMarkdown(msg.text)}${attHtml}</div>
    `;
    container.appendChild(div);
  });

  scrollMessages();
}

// ─── SEND MESSAGE ─────────────────────────────────────────────────────────
function addTypingIndicator() {
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.id = 'typing';
  div.innerHTML = `
    <div class="msg-avatar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a4 4 0 0 1 4 4v1a4 4 0 0 1-8 0V6a4 4 0 0 1 4-4z"/>
        <path d="M16 14v1a4 4 0 0 1-8 0v-1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/>
        <path d="M9 19v1a3 3 0 0 0 6 0v-1"/>
      </svg>
    </div>
    <div class="msg-content">
      <div class="typing-indicator">
        <span></span><span></span><span></span>
      </div>
    </div>`;
  container.appendChild(div);
  scrollMessages();
}

function removeTypingIndicator() {
  const el = document.getElementById('typing');
  if (el) el.remove();
}

const aiResponses = [
  "That's a great question. Let me think through this carefully and give you a thorough answer.\n\nBased on the context, here's what I'd recommend:\n\n1. **Start with the core problem** — understand what the user is actually trying to solve.\n2. **Break it down** — divide the solution into clear, testable components.\n3. **Validate early** — get real feedback before scaling up.\n\nWould you like me to expand on any of these points?",
  "Interesting challenge. I've analyzed the data and here's my assessment:\n\nThe key insight is that **simplicity scales better than complexity**. When teams try to solve too many problems at once, they end up solving none of them well.\n\n**Recommended approach:**\n- Focus on one metric at a time\n- Set measurable milestones\n- Review and iterate weekly\n\nWhat stage is your team currently at?",
  "Here's what I found — this aligns with best practices in the field:\n\n> \"The best solutions come from clearly defined problems, not from adding more features.\"\n\n**Next steps:**\n1. Define the success criteria\n2. Identify the biggest bottleneck\n3. Prototype a small, testable version\n4. Measure, learn, repeat\n\nShall I help you draft the spec for step 1?"
];

let responseIndex = 0;

function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  const hasAttachments = pendingAttachments.length > 0;
  if (!text && !hasAttachments) return;

  chatHistories[currentChatId] = chatHistories[currentChatId] || [];

  const sentAttachments = pendingAttachments.map(att => ({
    name: att.file.name,
    dataUrl: att.dataUrl,
    isImage: att.isImage
  }));

  chatHistories[currentChatId].push({ role: 'user', text: text || '(Attached files)', attachments: sentAttachments });
  pendingAttachments = [];
  renderAttachPreview();
  renderMessages(currentChatId);
  input.value = '';
  input.style.height = 'auto';

  addTypingIndicator();

  setTimeout(() => {
    removeTypingIndicator();
    const responses = chatHistories[currentChatId].length === 1 ? aiResponses : aiResponses.slice(1);
    const response = responses[responseIndex % responses.length];
    responseIndex++;
    chatHistories[currentChatId].push({ role: 'ai', text: response });
    renderMessages(currentChatId);
  }, 1400);
}

// ─── SIDEBAR COLLAPSE ──────────────────────────────────────────────────────
function toggleSidebar(forceCollapse) {
  if (forceCollapse === undefined) {
    isCollapsed = !isCollapsed;
  } else {
    isCollapsed = forceCollapse;
  }
  document.getElementById('app').classList.toggle('sidebar-collapsed', isCollapsed);
  document.getElementById('tweak-expand').classList.toggle('active', !isCollapsed);
  document.getElementById('tweak-collapse').classList.toggle('active', isCollapsed);
}

// ─── CHAT SWITCHING ────────────────────────────────────────────────────────
function switchChat(id) {
  currentChatId = id;
  renderSidebar();
  if (!chatHistories[id]) {
    chatHistories[id] = [{ role: 'ai', text: 'Hi there! I\'m your AI workspace assistant. What would you like to work on?' }];
  }
  renderMessages(id);
}

// ─── EVENT LISTENERS ────────────────────────────────────────────────────────
document.getElementById('sendBtn').addEventListener('click', sendMessage);

// File attachments
const fileInput = document.getElementById('fileInput');
const attachBtn = document.getElementById('attachBtn');

attachBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', () => {
  const files = Array.from(fileInput.files);
  files.forEach(file => {
    const isImage = imageExts.has(fileExt(file.name));
    if (isImage) {
      const reader = new FileReader();
      reader.onload = (e) => {
        pendingAttachments.push({ file, dataUrl: e.target.result, isImage: true });
        renderAttachPreview();
      };
      reader.readAsDataURL(file);
    } else {
      pendingAttachments.push({ file, dataUrl: '', isImage: false });
      renderAttachPreview();
    }
  });
  fileInput.value = '';
});

document.getElementById('chatInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

document.getElementById('chatInput').addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

document.getElementById('collapseBtn').addEventListener('click', () => toggleSidebar());

document.getElementById('tweak-expand').addEventListener('click', () => toggleSidebar(false));
document.getElementById('tweak-collapse').addEventListener('click', () => toggleSidebar(true));

document.getElementById('newChatBtn').addEventListener('click', () => {
  const newId = Date.now();
  chatTitles[newId] = 'New conversation';
  chatHistories[newId] = [
    { role: 'ai', text: 'Hi there! I\'m your AI workspace assistant. What would you like to work on today?' }
  ];
  renderSidebar();
  switchChat(newId);
});

// Init
renderSidebar();
renderMessages(currentChatId);
</script>
</body>
</html>
